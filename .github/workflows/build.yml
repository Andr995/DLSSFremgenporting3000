name: Build and test MFG research tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ampere-package:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare pinned precompiled backend and test deployment
        id: package
        shell: pwsh
        run: |
          $package = ./scripts/prepare-ampere.ps1
          ./tests/ampere_deployment_tests.ps1 -Package $package
          "directory=$package" >> $env:GITHUB_OUTPUT
      - name: Upload Ampere installation package
        uses: actions/upload-artifact@v4
        with:
          name: NVIDIA-FG-RTX3000-Cyberpunk
          path: ${{ steps.package.outputs.directory }}/*
          if-no-files-found: error
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure x64 MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Build pinned dependencies and run regression tests
        id: build
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: MFG-research-x64
          path: ${{ steps.build.outputs.package }}/*
          if-no-files-found: error

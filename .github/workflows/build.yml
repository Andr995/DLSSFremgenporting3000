name: Build RTX 30/40 MFG Unlock

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Clone Dependencies
        shell: pwsh
        run: |
          mkdir deps
          cd deps
          git clone --depth 1 https://github.com/NVIDIAGameWorks/Streamline.git
          git clone --depth 1 --branch v6.8.0 https://github.com/crosire/reshade.git
          git clone --depth 1 --branch v1.91.5 https://github.com/ocornut/imgui.git

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build -S source/native -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DSTREAMLINE_ROOT="${{ github.workspace }}/deps/Streamline" `
            -DRESHADE_ROOT="${{ github.workspace }}/deps/reshade" `
            -DIMGUI_ROOT="${{ github.workspace }}/deps/imgui" `
            -DMFG_UNLOCK_BUILD_UNIVERSAL_UI=ON

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release

      - name: Prepare Artifacts
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/RTX40MFGCore.dll dist/
          Copy-Item build/RTX40MFG.asi dist/
          Copy-Item build/RTX40MFG-UI.addon64 dist/
          if (Test-Path "bin/x64/global.ini") { Copy-Item bin/x64/global.ini dist/ }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RTX30_40_MFG_Unlock_x64
          path: dist/*
